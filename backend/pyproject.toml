    "fastapi==0.111.0",
    "fastapi-cli==0.0.2",
    "uvicorn==0.29.0",
    "starlette==0.37.2",
    "python-multipart==0.0.9",

    # OpenAI & LLM
    "openai==1.25.1",
    # Note: Gemini uses REST API directly (no SDK needed due to websockets conflict with pyppeteer)
    "langchain==0.1.20",
    "langchain-community==0.0.38",
    "langchain-core==0.1.52",
    "langchain-text-splitters==0.0.1",
    "langsmith==0.1.57",
    "transformers==4.42.4",
    "tokenizers==0.19.1",
    "huggingface-hub==0.24.0",
    "safetensors==0.4.3",

    # Data Validation & Processing
    "pydantic==2.7.1",
    "pydantic-core==2.18.2",
    "dataclasses-json==0.6.6",
    "marshmallow==3.21.2",
    "email-validator==2.1.1",

