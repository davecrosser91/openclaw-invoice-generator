[project]
name = "docgen-python-backend"
version = "1.0.11"
description = "AI-powered synthetic invoice generation system using GPT-5.1"
authors = [
    {name = "David Kreuzer", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

keywords = ["invoice", "document-generation", "gpt-5", "synthetic-data", "pdf"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

